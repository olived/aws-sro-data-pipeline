<title id="title">AWS Data Engineering POC — SRO Pipeline</title>
<desc id="desc">EventBridge Scheduler triggers sfn_sro_pipeline with eight sequential AWS Glue jobs. S3 dgo-sro-data-lake holds landing, bronze, silver and gold layers for apolice and endosso. Glue Data Catalog sro_catalog and Athena support validation.</desc>
